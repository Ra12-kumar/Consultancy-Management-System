# Base for the Udaan education consultancy system. Deploy an overlay, not the base directly:
#   kubectl apply -k deploy/k8s/overlays/staging
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: education-consultancy
labels:
  - pairs: { app.kubernetes.io/part-of: education-consultancy }
    includeSelectors: false
resources:
  - namespace.yaml
  - config.yaml
  - storage.yaml
  - redis.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml
  - network-policy.yaml
