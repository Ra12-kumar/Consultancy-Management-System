# API: stateless Express pods (sessions in MongoDB, cache and rate limits in Redis), so any pod can serve any
# request. Uploads need a volume every pod can write to (ReadWriteMany, see uploads-pvc in storage.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: education-consultancy }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: education-consultancy }
    spec:
      # The API finishes in-flight requests within 8 s of SIGTERM; give it a little more.
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # Spread pods across nodes so one node failure does not take the API down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: api } }
      containers:
        - name: api
          image: education-consultancy-api
          ports:
            - { name: http, containerPort: 5100 }
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef: { name: api-secrets }
          # Let the ingress stop sending traffic before the process starts shutting down.
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 3
            failureThreshold: 20
          # Liveness never checks dependencies, so a database outage does not cause restart loops.
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: 503 while MongoDB is unreachable, so the pod gets no traffic until it can serve it.
          readinessProbe:
            httpGet: { path: /api/health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: uploads, mountPath: /data/uploads }
            # The college finder keeps its downloaded college list here (rebuilt automatically if lost).
            - { name: finder-cache, mountPath: /data/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: uploads }
        - name: finder-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: { app.kubernetes.io/name: api }
spec:
  selector: { app.kubernetes.io/name: api }
  ports:
    - { name: http, port: 5100, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
# Voluntary disruptions (node drains, upgrades) always leave at least one API pod running.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: api }
