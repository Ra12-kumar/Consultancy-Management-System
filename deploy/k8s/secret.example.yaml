# TEMPLATE ONLY. This file is not part of the kustomization and holds no real values.
# Create the real Secret directly in the cluster, for example:
#
#   kubectl -n education-consultancy create secret generic api-secrets \
#     --from-literal=SESSION_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=MONGODB_URI='mongodb+srv://USER:PASSWORD@cluster.example.mongodb.net/education_consultancy' \
#     --from-literal=BREVO_API_KEY='xkeysib-…' \
#     --from-literal=EMAIL_FROM='noreply@your-domain.in'
#
# or use your cloud's secret manager (External Secrets Operator, Sealed Secrets, …). Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: education-consultancy
type: Opaque
stringData:
  SESSION_SECRET: replace-with-64-random-hex-characters
  MONGODB_URI: mongodb+srv://USER:PASSWORD@cluster.example.mongodb.net/education_consultancy
  # Email: either Brevo (API key + sender) or SMTP (SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, EMAIL_FROM).
  BREVO_API_KEY: xkeysib-replace-me
  EMAIL_FROM: noreply@example.com
  # Optional: ADMIN_NOTIFY_EMAILS, RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET, COLLEGEDB_API_KEY
