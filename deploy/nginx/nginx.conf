# Reverse proxy and load balancer for the Udaan education consultancy stack (docker-compose.scale.yml).
#   /api/*  -> the API instances (least connections, passive health checks)
#   /*      -> the Next.js web server
# TLS: terminate HTTPS here (add a `listen 443 ssl` server with your certificates) or at a cloud load balancer
# in front of this proxy. See docs/LOAD_BALANCING.md.

worker_processes auto;

events {
  worker_connections 4096;
}

http {
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  keepalive_requests 1000;

  # Request limits: uploads go up to 10 MB (brochures); JSON bodies are limited again by the API (100 KB).
  client_max_body_size 12m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  send_timeout 30s;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml application/xml;

  log_format main '$remote_addr "$request" $status $body_bytes_sent $request_time '
                  'upstream=$upstream_addr upstream_time=$upstream_response_time id=$request_id';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  upstream api {
    least_conn;
    # Passive health checks: an instance that fails 3 times is skipped for 10 s.
    server api:5100 max_fails=3 fail_timeout=10s;
    server api2:5100 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  upstream web {
    server web:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  # Shared proxy settings.
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  # This proxy is the edge: it REPLACES any client-supplied X-Forwarded-For, so IP-based rate limits cannot be
  # dodged with a forged header (the API trusts exactly one proxy: TRUST_PROXY=1).
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;
  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;
  # Retry another instance only when the request never reached one (safe for writes too).
  proxy_next_upstream error timeout;
  proxy_next_upstream_tries 2;

  server {
    listen 80;
    server_name _;

    # Health of the proxy itself (for a cloud load balancer in front). Reveals nothing about the backends.
    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location /api/ {
      # Which instance answered is in the access log (upstream=), never in response headers.
      proxy_pass http://api;
    }

    location / {
      proxy_pass http://web;
    }
  }
}
