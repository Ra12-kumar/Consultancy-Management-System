# Horizontal scaling add-on for docker-compose.yml: Redis (shared cache and rate limits), a second API
# instance and an Nginx load balancer in front of everything.
#
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --build
#
# Nginx listens on 127.0.0.1:8088 (put HTTPS / a cloud load balancer in front). See docs/LOAD_BALANCING.md.
# Nothing here drops or resets data.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cache and counters only (MongoDB stays the source of truth): bounded memory, least-recently-used eviction,
    # no persistence needed.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  # Same image and settings as `api`; both share MongoDB, Redis and the uploads volume.
  api2:
    extends:
      file: docker-compose.yml
      service: api
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    environment:
      # Server-side calls from Next.js also go through the balancer.
      API_INTERNAL_URL: http://nginx:80

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - api
      - api2
      - web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
