  <!-- lawn, path, trees -->
  <rect y="540" width="1600" height="160" fill="url(#lawn)"/>
  <polygon points="760,560 840,560 1000,700 600,700" fill="#d6b48c" opacity="0.9"/>
  <g fill="#14532d">
    <circle cx="300" cy="520" r="70"/><circle cx="360" cy="545" r="55"/><rect x="295" y="560" width="14" height="60" fill="#3f2a14"/>
    <circle cx="1300" cy="515" r="75"/><circle cx="1235" cy="545" r="50"/><rect x="1295" y="560" width="14" height="60" fill="#3f2a14"/>
    <circle cx="80" cy="560" r="60"/><circle cx="1530" cy="560" r="60"/>
